<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordCraft — Sentence Patterns</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/topics.css" />
  <link rel="stylesheet" href="css/sentences/layout.css" />
  <link rel="stylesheet" href="css/streak.css" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body class="sentences-page">

  <!-- ===== Navbar ===== -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="topics.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        WordCraft
      </a>
      <div class="navbar-spacer"></div>
      <div class="navbar-right">
        <span id="navbar-streak" class="navbar-streak" style="display:none">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 8 0 7.5 2 5.5 4 4.75 4.75 4.75 4.75 3.25 4.25 3.5 2.75 1.5 4.75 1 7.25 1 8.75 1 12.25 4.686 16 8 16zm0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3 .125.75 1 1.25 1 1.25S8 9 8 8c.5 1 1.5 2 2 3 .75.75 1 1.5 1 2.25C11 14 9.657 15 8 15z"/>
          </svg>
          <span id="navbar-streak-count">0</span>
        </span>
        <div class="navbar-user-info">
          <span class="navbar-avatar" id="nav-avatar"></span>
          <span class="navbar-username" id="nav-username"></span>
        </div>
        <div class="navbar-vdivider"></div>
        <button id="btn-logout" class="btn-signout">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign out
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== Main Content ===== -->
  <main class="container topics-container">

    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <a href="topics.html">My Topics</a>
      <span class="breadcrumb-separator">›</span>
      <span>Sentence Patterns</span>
    </div>

    <!-- Header -->
    <div class="topics-header">
      <div class="topics-header-left">
        <h2 class="topics-title">Sentence Patterns</h2>
        <span id="topic-count" class="topics-count-chip"></span>
      </div>
      <div class="topics-header-right">
        <select id="sort-topics" class="sort-select hidden">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="name-az">Name A → Z</option>
          <option value="name-za">Name Z → A</option>
          <option value="words-desc">Most sentences</option>
          <option value="words-asc">Fewest sentences</option>
        </select>
        <div class="topics-search hidden" id="topics-search-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input class="form-input" type="text" id="input-search-topics" placeholder="Search topics…" />
        </div>
        <button id="btn-new-topic" class="btn btn-primary btn-sm">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New Topic
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div id="topics-loading" class="text-center" style="padding:var(--sp-8)">
      <div class="spinner spinner-lg"></div>
    </div>

    <!-- Empty state -->
    <div id="topics-empty" class="empty-state hidden">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
      </svg>
      <h3>No Sentence Topics Yet</h3>
      <p>Create your first sentence-pattern topic to get started!</p>
      <button id="btn-new-topic-empty" class="btn btn-primary">Create a Topic</button>
    </div>

    <!-- Topic Grid -->
    <div id="topics-grid" class="topics-grid hidden"></div>
  </main>

  <!-- ===== New / Rename Topic Modal ===== -->
  <div id="modal-topic" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-topic-title">New Topic</h3>
        <button class="btn-icon" data-close-modal aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form id="form-topic">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="input-topic-name">Topic Name</label>
            <input class="form-input" type="text" id="input-topic-name"
                   placeholder="e.g. Conditional Sentences" maxlength="80" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
          <button type="submit" id="btn-topic-save" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Firebase SDK ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- ===== App Script ===== -->
  <script type="module" src="js/pages/sentences-page.js"></script>
</body>
</html>
